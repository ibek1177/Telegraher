name: New Year 2027 test APK
on:
  push:
    branches: [new-year-2027]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.5'
      - name: Install Android native tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android sdkmanager missing at $SDKMANAGER"
            exit 1
          fi
          set +o pipefail
          yes | "$SDKMANAGER" --install "cmake;3.22.1" "ndk;27.2.12479018"
          set -o pipefail
          CMAKE_DIR="$ANDROID_HOME/cmake/3.22.1"
          NDK_DIR="$ANDROID_HOME/ndk/27.2.12479018"
          test -x "$CMAKE_DIR/bin/cmake"
          test -d "$NDK_DIR"
          "$CMAKE_DIR/bin/cmake" --version
          printf 'sdk.dir=%s\ncmake.dir=%s\n' "$ANDROID_HOME" "$CMAKE_DIR" > local.properties
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
      - name: Build test APK
        run: gradle :TMessagesProj_AppStandalone:assembleStandalone --stacktrace
      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: new-year-2027-test-apk
          path: TMessagesProj_AppStandalone/build/outputs/apk/**/*.apk
          if-no-files-found: error
